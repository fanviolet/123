name: Build HighStack Native 3D APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-godot-3d:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3D asset pipeline
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore native game script and generate GLB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p highstack3d/scripts highstack3d/assets/models highstack3d/assets/icons highstack3d/build
          echo "773d84e4123f5ba20e1c4e93502b19df78070023768b46dcf1c9a5581951cd00  highstack3d/tools/game.part01.b64" | sha256sum -c -
          echo "7bcfd5185fdb5b5600fd246302eb5fcfba8e6a1688aa2be4bce68bd6d56bb660  highstack3d/tools/game.part02.b64" | sha256sum -c -
          echo "a51204a4f0d55a114f5bca51f1aa5f532a484993bbbcd2148e133c5d4e3a00c7  highstack3d/tools/game.part03.b64" | sha256sum -c -
          echo "3d6d7e2e83b49135a943d9821ab718df717e8bbbf98f418b58b2394d7082e59c  highstack3d/tools/game.part04.b64" | sha256sum -c -
          echo "176eaa33b13dc5f252c8b1e1d5a0ff05d5e0c31bfb277bf242fd3019116b1514  highstack3d/tools/game.part05.b64" | sha256sum -c -
          cat highstack3d/tools/game.part0{1,2,3,4,5}.b64 | tr -d '[:space:]' | base64 -d | gzip -dc > highstack3d/scripts/game.gd
          echo "68658f634f5ad46a3f3b51261a3255e6f30ed8d98ad6a66775d07b321b25cdb2  highstack3d/scripts/game.gd" | sha256sum -c -
          python -m pip install --disable-pip-version-check --quiet trimesh pillow numpy
          python highstack3d/tools/generate_assets.py
          test -s highstack3d/assets/models/mascot_blox.glb
          test -s highstack3d/assets/models/crate.glb
          test -s highstack3d/assets/icons/icon.png
          ls -lh highstack3d/assets/models

      - name: Generate temporary test signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/highstack3d/highstack-test.keystore" \
            -storepass android -keypass android -alias highstack \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HighStack Test,O=HighStack Studio,C=VN"

      - name: Import assets and export Android APK with Godot 4.7.2
        uses: dulvui/godot-android-export@v4
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/highstack3d/highstack-test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: highstack
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        with:
          godot-version: '4.7.2'
          godot-channel: stable
          working-directory: highstack3d

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          test -s highstack3d/build/HighStack3D-3D-Debug.apk
          cp highstack3d/build/HighStack3D-3D-Debug.apk HighStack3D-Native3D-v0.5.apk
          sha256sum HighStack3D-Native3D-v0.5.apk > HighStack3D-Native3D-v0.5.sha256
          ls -lh HighStack3D-Native3D-v0.5.apk
          unzip -t HighStack3D-Native3D-v0.5.apk >/dev/null

      - name: Package readable source and generated 3D assets
        shell: bash
        run: |
          rm -f highstack3d/highstack-test.keystore
          rm -f highstack3d/tools/game.gd.gz.b64 highstack3d/tools/game.part*.b64
          zip -qr HighStack3D-Native3D-Source.zip highstack3d -x 'highstack3d/android/*' 'highstack3d/.godot/*' 'highstack3d/build/*'

      - uses: actions/upload-artifact@v4
        with:
          name: HighStack3D-Native3D-Build
          path: |
            HighStack3D-Native3D-v0.5.apk
            HighStack3D-Native3D-v0.5.sha256
            HighStack3D-Native3D-Source.zip
          if-no-files-found: error
