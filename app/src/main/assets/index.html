<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HighStack 3D</title><style>html,body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;height:100%;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}.top{padding:10px 14px;display:flex;justify-content:space-between;background:#111827}.stats{display:flex;gap:16px;font-size:14px}canvas{flex:1;width:100%;display:block;background:linear-gradient(#334155,#111827)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:8px;padding:10px;background:#111827}button{border:0;border-radius:14px;padding:13px 8px;font-weight:700;font-size:15px;background:#334155;color:#fff}.drop{background:#22c55e;color:#052e16}.items{display:flex;gap:8px;padding:0 10px 10px;background:#111827}.items button{flex:1;font-size:12px;padding:10px 5px}.msg{position:absolute;left:12px;right:12px;top:58px;text-align:center;font-weight:800;text-shadow:0 2px 3px #000;pointer-events:none}.over{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center}.card{background:#111827;border:1px solid #475569;border-radius:20px;padding:24px;width:min(82%,340px);text-align:center}.card button{width:100%;margin-top:10px}.rank{font-size:12px;color:#cbd5e1}</style></head><body><div id="app"><div class="top"><div class="stats"><b id="height">0.0m</b><span>⭐ <b id="score">0</b></span><span>🪙 <b id="coins">500</b></span></div><div class="rank" id="rank">Bronze III</div></div><canvas id="c"></canvas><div class="msg" id="msg">Di chuyển, xoay rồi THẢ</div><div class="items"><button id="stab">🧲 Stabilizer ×1</button><button id="platform">🛟 Platform ×1</button><button id="undo">🏗️ Undo ×1</button></div><div class="controls"><button id="left">←</button><button id="rot">↻</button><button id="right">→</button><button class="drop" id="drop">THẢ</button></div></div><div class="over" id="over"><div class="card"><h2>Tháp đã sập!</h2><p id="final"></p><button id="rescue">▶ Cứu 1 lượt</button><button id="restart">Chơi lại</button></div></div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),H=document.querySelector('#height'),S=document.querySelector('#score'),C=document.querySelector('#coins'),M=document.querySelector('#msg'),O=document.querySelector('#over'),F=document.querySelector('#final'),R=document.querySelector('#rank');let W,h,stack,cur,score,coins=500,cam=0,over=false,rescued=false,items={stab:1,platform:1,undo:1},armed=false,last=0;const types=[['Thùng gỗ',92,62,'#a16207'],['Sách',132,30,'#be123c'],['Gạch',104,44,'#b45309'],['Thanh gỗ',152,28,'#92400e'],['Lon',58,82,'#0284c7'],['Carton',112,72,'#ca8a04']];function resize(){W=c.width=Math.floor(innerWidth*devicePixelRatio);h=c.height=Math.floor((innerHeight-154)*devicePixelRatio);x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function top(){return stack.reduce((m,b)=>Math.max(m,b.y+b.h),0)}function spawn(){let t=types[Math.floor(Math.random()*types.length)];cur={name:t[0],w:t[1],h:t[2],color:t[3],x:40,y:top()+160,v:0,drop:false,dir:1}}function reset(){stack=[{x:20,y:0,w:innerWidth-40,h:18,color:'#64748b',name:'Bệ'}];score=0;cam=0;over=false;rescued=false;O.style.display='none';spawn();ui()}function ov(a,b){return Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))}function fail(){over=true;O.style.display='flex';F.textContent=`Chiều cao ${(Math.max(0,top()-18)/18).toFixed(1)} m · ${score} điểm`;ui()}function land(s){cur.y=s.y+s.h;let r=ov(cur,s)/cur.w;if(r<(armed?.08:.25)){if(armed&&r>.03){}else{return fail()}}stack.push({...cur});let center=Math.abs((cur.x+cur.w/2)-(s.x+s.w/2));let perfect=center<Math.min(cur.w,s.w)*.08;let p=Math.round(cur.h+(r*80)+(perfect?100:0));score+=p;coins+=Math.max(5,Math.round(p/18));M.textContent=perfect?'✨ PERFECT!':`+${p} điểm`;armed=false;spawn();ui()}function ui(){let m=Math.max(0,(top()-18)/18);H.textContent=m.toFixed(1)+'m';S.textContent=score;C.textContent=coins;let rp=Math.floor(score/8),ranks=['Bronze III','Bronze II','Bronze I','Silver','Gold','Platinum','Diamond','Master','Legend'];R.textContent=ranks[Math.min(ranks.length-1,Math.floor(rp/250))];document.querySelector('#stab').textContent=`🧲 Stabilizer ×${items.stab}`;document.querySelector('#platform').textContent=`🛟 Platform ×${items.platform}`;document.querySelector('#undo').textContent=`🏗️ Undo ×${items.undo}`}function move(d){if(!over&&!cur.drop)cur.x=Math.max(0,Math.min(innerWidth-cur.w,cur.x+d))}function rotate(){if(!over&&!cur.drop){let q=cur.w;cur.w=cur.h;cur.h=q}}function drop(){if(!over&&!cur.drop)cur.drop=true}function draw(){x.clearRect(0,0,innerWidth,innerHeight);let ground=(h/devicePixelRatio)-30;let target=Math.max(0,top()-320);cam+=(target-cam)*.08;for(const b of stack)box(b,ground);if(cur)box(cur,ground,true)}function box(b,g,active){let yy=g-(b.y-cam)-b.h;x.fillStyle=b.color;x.fillRect(b.x,yy,b.w,b.h);x.strokeStyle=active?'#fff':'#0005';x.lineWidth=2;x.strokeRect(b.x,yy,b.w,b.h);if(b.w>55&&b.h>25){x.fillStyle='#fff';x.font='12px system-ui';x.textAlign='center';x.fillText(b.name,b.x+b.w/2,yy+b.h/2+4)}}function tick(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(!over&&cur){if(!cur.drop){cur.x+=cur.dir*90*dt;if(cur.x<0||cur.x+cur.w>innerWidth){cur.dir*=-1;cur.x=Math.max(0,Math.min(innerWidth-cur.w,cur.x))}}else{let prev=cur.y;cur.v+=620*dt;cur.y-=cur.v*dt;let best=null,bt=-1;for(const s of stack){let st=s.y+s.h;if(ov(cur,s)>0&&prev>=st&&cur.y<=st&&st>bt){best=s;bt=st}}if(best)land(best);else if(cur.y<-100)fail()}}draw();requestAnimationFrame(tick)}document.querySelector('#left').onclick=()=>move(-24);document.querySelector('#right').onclick=()=>move(24);document.querySelector('#rot').onclick=rotate;document.querySelector('#drop').onclick=drop;document.querySelector('#stab').onclick=()=>{if(items.stab>0&&!over){items.stab--;armed=true;M.textContent='🧲 Stabilizer ACTIVE';ui()}};document.querySelector('#platform').onclick=()=>{if(items.platform>0&&!over&&!cur.drop){items.platform--;let w=Math.min(190,innerWidth-30),xx=Math.max(15,Math.min(innerWidth-w-15,cur.x+cur.w/2-w/2));stack.push({x:xx,y:top()+20,w,h:14,color:'#06b6d4',name:'Platform'});ui()}};document.querySelector('#undo').onclick=()=>{if(items.undo>0&&!over&&stack.length>1){items.undo--;stack.pop();score=Math.max(0,score-50);ui()}};document.querySelector('#restart').onclick=reset;document.querySelector('#rescue').onclick=()=>{if(over&&!rescued){rescued=true;over=false;O.style.display='none';if(stack.length>1)stack.pop();spawn();M.textContent='▶ Đã cứu lượt chơi';ui()}};c.addEventListener('pointerdown',drop);reset();requestAnimationFrame(tick)})()</script></body></html>
